name: Local-pin package checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Fetch the pinned Git inputs
        env:
          GH_TOKEN: ${{ secrets.NULLKOMMA_INPUTS_READ_TOKEN }}
        run: |
          gh auth setup-git
          for input in nullkomma brand; do
            rev="$(jq -r ".nodes[\"$input\"].locked.rev" flake.lock)"
            gh repo clone "dataheld/$input" "$RUNNER_TEMP/$input" -- --no-checkout
            git -C "$RUNNER_TEMP/$input" checkout --detach "$rev"
          done
      - name: Check without publishing or changing the lockfile
        run: |
          nullkomma_rev="$(jq -r .nodes.nullkomma.locked.rev flake.lock)"
          brand_rev="$(jq -r .nodes.brand.locked.rev flake.lock)"
          nix flake check --no-write-lock-file \
            --override-input nullkomma \
              "git+file://$RUNNER_TEMP/nullkomma?rev=$nullkomma_rev" \
            --override-input brand \
              "git+file://$RUNNER_TEMP/brand?rev=$brand_rev"
